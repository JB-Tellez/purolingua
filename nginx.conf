server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html index.htm;

    # Matches Next.js `output: 'export'` with `trailingSlash: true`
    location / {
        try_files $uri $uri.html $uri/index.html $uri/index.htm $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
